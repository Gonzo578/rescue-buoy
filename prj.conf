# Serial console. The board DTS already sets zephyr,console = &uart0 at
# 115200 baud, and uart0 (GPIO43/44) is wired to the CH343 USB-UART bridge,
# so the same USB cable carries both flashing and the console.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Logging. Immediate mode means log calls are rendered synchronously, so the
# startup banner cannot be lost. Switch to the default deferred mode once the
# application grows and logging gets on the hot path.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Blinking LED (see boards/esp32s3_devkitc_esp32s3_procpu.overlay).
CONFIG_GPIO=y
